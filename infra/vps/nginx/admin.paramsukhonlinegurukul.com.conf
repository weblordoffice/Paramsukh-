server {
    listen 80;
    server_name admin.paramsukhonlinegurukul.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.paramsukhonlinegurukul.com;

    ssl_certificate /etc/letsencrypt/live/admin.paramsukhonlinegurukul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.paramsukhonlinegurukul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;
    limit_req zone=admin_limit burst=5 nodelay;

    gzip on;
    gzip_types application/json text/css application/javascript text/html text/plain;
    gzip_min_length 256;
    gzip_comp_level 4;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
